name: Setup Smartling
description: Setup Smartling for translation workflows

inputs:
  npm_token:
    description: 'SMARTLING_BOT_NPM_TOKEN'
    required: true
  project_id:
    description: 'SMARTLING_PROJECT_ID'
    required: true
  user_identifier:
    description: 'SMARTLING_USER_IDENTIFIER'
    required: true
  user_secret:
    description: 'SMARTLING_USER_SECRET'
    required: true

outputs:
  smartling_bot_cli:
    description: 'Executable of the installed @adyen/smartling-bot CLI'
    value: ${{ steps.install-smartling-bot.outputs.smartling_bot_cli }}

runs:
  using: composite
  steps:
    - name: Create the configuration file
      shell: sh
      env:
        NPM_READ_ONLY_TOKEN: ${{ inputs.npm_token }}
        SMARTLING_PROJECT_ID: ${{ inputs.project_id }}
        SMARTLING_USER_IDENTIFIER: ${{ inputs.user_identifier }}
        SMARTLING_USER_SECRET: ${{ inputs.user_secret }}
      run: |
        cat <<EOF >> .smartlingrc
        SMARTLING_PROJECT_ID=$SMARTLING_PROJECT_ID
        SMARTLING_USER_IDENTIFIER=$SMARTLING_USER_IDENTIFIER
        SMARTLING_USER_SECRET=$SMARTLING_USER_SECRET
        EOF
        npm config set //registry.npmjs.org/:_authToken "$NPM_READ_ONLY_TOKEN"

    - name: Install smartling-bot
      id: install-smartling-bot
      shell: sh
      run: |
        # The CLI is installed once at an exact, immutable version instead of being fetched on
        # demand with npx; the workflows run the installed executable directly.
        install_directory="$RUNNER_TEMP/smartling-bot"
        npm install --prefix "$install_directory" @adyen/smartling-bot@0.13.2
        smartling_bot_cli="$install_directory/node_modules/.bin/smartling-bot"
        
        if [ ! -x "$smartling_bot_cli" ]; then
            echo "The smartling-bot executable is missing after installation: $smartling_bot_cli" >&2
            exit 1
        fi
        
        echo "smartling_bot_cli=$smartling_bot_cli" >> "$GITHUB_OUTPUT"
