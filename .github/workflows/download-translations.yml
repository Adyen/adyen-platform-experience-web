name: Download translations

on:
  workflow_dispatch:

# Download runs for a release line must not race each other on the bot branch
concurrency:
  group: translations-download-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  download-files:
    name: Download completed translation files
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: smartling-translations # provides Smartling credentials
    permissions:
      actions: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Run the preliminary setup steps
        uses: ./.github/actions/setup-env
        with:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

      - name: Run setup steps for translation tasks
        id: setup-smartling
        uses: ./.github/actions/setup-smartling
        with:
          npm_token: ${{ secrets.NPM_READ_ONLY_TOKEN }}
          project_id: ${{ secrets.SMARTLING_PROJECT_ID }}
          user_identifier: ${{ secrets.SMARTLING_USER_IDENTIFIER }}
          user_secret: ${{ secrets.SMARTLING_USER_SECRET }}

      - name: Download and commit files
        run: |
          # Checkout new branch from the default branch
          git checkout -B "$BRANCH_NAME" "$BASE_REF"

          # Configure the Git user (GitHub Actions Bot)
          # See https://github.com/orgs/community/discussions/26560
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Download files from Smartling
          "$SMARTLING_BOT_CLI" download-files -p ./scripts/process-translations/post-download.sh
        env:
          BASE_REF: ${{ github.ref_name }}
          BRANCH_NAME: "bot/translations-v2"
          COMMIT_TITLE: "chore(lang): update translations"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMARTLING_BOT_CLI: ${{ steps.setup-smartling.outputs.smartling_bot_cli }}
