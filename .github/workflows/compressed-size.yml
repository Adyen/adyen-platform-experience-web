name: Compressed Size

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop
      - version/v1.x
      - group/*

jobs:
  build:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.0.8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: 'pnpm'

      - name: Configure npm registry auth
        env:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_READ_ONLY_TOKEN}" >> .npmrc

      - uses: preactjs/compressed-size-action@v2
        with:
          install-script: "pnpm install --frozen-lockfile"
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          pattern: "**/dist/**/*.js"
          exclude: "{**/*.map,**/node_modules/**,**/src}"
