name: Compressed Size

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    branches:
      - main
      - develop
      - version/v1.x
      - group/*

jobs:
  is-pr-approved:
    if: |
      github.event_name == 'pull_request' ||
      github.event.pull_request.base.ref == 'main' ||
      github.event.pull_request.base.ref == 'develop' ||
      github.event.pull_request.base.ref == 'version/v1.x' ||
      startsWith(github.event.pull_request.base.ref, 'group/')
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - id: check-approval
        run: gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json reviews --jq '.reviews[].state' | grep -Fxq APPROVED
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        continue-on-error: true

      - run: echo ${{ steps.check-approval.outcome == 'success' }}
    outputs:
      approved: ${{ steps.check-approval.outcome == 'success' }}
  build:
    needs: is-pr-approved
    if: needs.is-pr-approved.outputs.approved == 'true'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.0.8

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: 'pnpm'

      - name: Configure npm registry auth
        env:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_READ_ONLY_TOKEN}" >> .npmrc

      - uses: preactjs/compressed-size-action@v2
        with:
          install-script: "pnpm install --frozen-lockfile"
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          pattern: "**/dist/**/*.js"
          exclude: "{**/*.map,**/node_modules/**,**/src}"
