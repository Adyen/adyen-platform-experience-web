name: Generate SRI Hashes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., v1.9.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version number (e.g., v1.9.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  BASE_URL: "https://bae81f955b.cdn.adyen.com/platform-components"
  VERSION: ${{ inputs.version }}

jobs:
  generate-sri:
    runs-on: ubuntu-latest
    steps:
      - name: Generate SRI Hashes
        run: |
          set -o pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'. Expected semver like v1.9.0"
            exit 1
          fi

          JS_URL="${BASE_URL}/${VERSION}/adyen-platform-experience-web.js"
          CSS_URL="${BASE_URL}/${VERSION}/adyen-platform-experience-web.css"

          # The entry embeds the SRI hash of every lazily loaded chunk, so it is the only JS file integrators pin.
          echo "Fetching JavaScript file..."
          JS_HASH=$(curl -sf "$JS_URL" | openssl dgst -sha384 -binary | openssl base64 -A)

          echo "Fetching CSS file..."
          CSS_HASH=$(curl -sf "$CSS_URL" | openssl dgst -sha384 -binary | openssl base64 -A)

          # Print to logs
          echo "================================"
          echo "Version: ${VERSION}"
          echo "JS Hash: sha384-${JS_HASH}"
          echo "CSS Hash: sha384-${CSS_HASH}"
          echo "================================"

          # Add to job summary
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## 🔐 SRI Hashes for Version ${VERSION}

          ### JavaScript
          **URL:** \`${JS_URL}\`

          **Integrity Hash:** \`sha384-${JS_HASH}\`

          The entry embeds the integrity hashes of every lazily loaded chunk and verifies each chunk before importing it.
          Pin it with a module script placed before any script that imports the SDK, so later imports of the same URL
          reuse the verified module.

          \`\`\`html
          <script type="module"
                  src="${JS_URL}"
                  integrity="sha384-${JS_HASH}"
                  crossorigin="anonymous"></script>
          \`\`\`

          ### CSS
          **URL:** \`${CSS_URL}\`

          **Integrity Hash:** \`sha384-${CSS_HASH}\`

          \`\`\`html
          <link href="${CSS_URL}"
                rel="stylesheet"
                integrity="sha384-${CSS_HASH}"
                crossorigin="anonymous">
          \`\`\`

          ---

          ### 📋 Complete Integration
          \`\`\`html
          <!-- Adyen Platform Experience Web ${VERSION} -->
          <link href="${CSS_URL}"
                rel="stylesheet"
                integrity="sha384-${CSS_HASH}"
                crossorigin="anonymous">

          <script type="module"
                  src="${JS_URL}"
                  integrity="sha384-${JS_HASH}"
                  crossorigin="anonymous"></script>

          <!-- Module scripts run in document order, so the global is defined here -->
          <script type="module">
            const { AdyenPlatformExperience } = window.AdyenPlatformExperienceWeb;
            // or: import { AdyenPlatformExperience } from '${JS_URL}';
          </script>
          \`\`\`
          EOF

          echo "JS_HASH=sha384-${JS_HASH}" >> $GITHUB_ENV
          echo "CSS_HASH=sha384-${CSS_HASH}" >> $GITHUB_ENV

      # TODO: Configure Slack webhook before enabling this step
      # - name: Notify Slack with SRI hashes
      #   env:
      #     SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      #     VERSION: ${{ inputs.version }}
      #   run: |
      #     curl -X POST -H 'Content-Type: application/json' \
      #       --data "{
      #         \"text\": \"@pie-frontend :lock: SRI Hashes for v${VERSION}\\n\\nJS: \`${JS_HASH}\`\\nCSS: \`${CSS_HASH}\`\\n\\nJS URL: \`${BASE_URL}/${VERSION}/adyen-platform-experience-web.js\`\\nCSS URL: \`${BASE_URL}/${VERSION}/adyen-platform-experience-web.css\`\\n\\nSee <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|workflow run> for full integration snippets.\"
      #       }" $SLACK_WEBHOOK_URL
