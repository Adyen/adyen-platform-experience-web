name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        default: 'stable'
        options:
          - stable
          - pre-release
          - promote
      prerelease_tag:
        description: 'Pre-release tag (only for pre-release type)'
        required: false
        type: choice
        default: 'beta'
        options:
          - beta
          - alpha
          - rc
          - next

jobs:
  create-release-pr:
    if: github.repository == 'adyen/adyen-platform-experience-web'
    name: Create release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout develop branch (full history)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Run the preliminary setup steps
        uses: ./.github/actions/setup-env
        with:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

      - name: Fetch main branch
        run: git fetch origin main:main

      # ── Pre-release: create/update pre-release branch, enter pre-release mode ──
      - name: Set up pre-release branch
        if: inputs.release_type == 'pre-release'
        env:
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          PRERELEASE_BRANCH="pre-release/$TAG"
          echo "PRERELEASE_BRANCH=$PRERELEASE_BRANCH" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or update the pre-release branch from develop
          if git ls-remote --heads origin "$PRERELEASE_BRANCH" | grep -q "$PRERELEASE_BRANCH"; then
            git fetch origin "$PRERELEASE_BRANCH"
            git checkout "$PRERELEASE_BRANCH"
            git merge origin/develop --no-edit
          else
            git checkout -b "$PRERELEASE_BRANCH"
          fi

          # Enter pre-release mode if not already active
          if [ ! -f .changeset/pre.json ]; then
            pnpm changeset pre enter "$TAG"
            git add .changeset/pre.json
            git commit -m "chore(release): enter pre-release mode ($TAG)"
          fi

          git push origin "$PRERELEASE_BRANCH"

      # ── Promote: exit pre-release mode on the pre-release branch ──
      - name: Promote pre-release to stable
        if: inputs.release_type == 'promote'
        env:
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          PRERELEASE_BRANCH="pre-release/$TAG"
          echo "PRERELEASE_BRANCH=$PRERELEASE_BRANCH" >> "$GITHUB_ENV"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Checkout the existing pre-release branch
          if ! git ls-remote --heads origin "$PRERELEASE_BRANCH" | grep -q "$PRERELEASE_BRANCH"; then
            echo "::error::Branch $PRERELEASE_BRANCH does not exist. Run a pre-release first."
            exit 1
          fi

          git fetch origin "$PRERELEASE_BRANCH"
          git checkout "$PRERELEASE_BRANCH"

          if [ ! -f .changeset/pre.json ]; then
            echo "::error::No pre.json found on $PRERELEASE_BRANCH. Pre-release mode is not active."
            exit 1
          fi

          pnpm changeset pre exit
          git add .changeset/pre.json
          git commit -m "chore(release): exit pre-release mode"
          git push origin "$PRERELEASE_BRANCH"

      - name: Validate changesets exist
        if: inputs.release_type != 'promote'
        run: |
          pnpm changeset status || {
            echo "::error::No changesets found. Cannot proceed with release."
            exit 1
          }

      - name: Determine new version
        run: |
          pnpm changeset status --output=release.json
          NEW_VERSION=$(jq -r '.releases[0].newVersion' release.json)
          rm release.json
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Create Pull Request
        run: |
          case "${{ inputs.release_type }}" in
            pre-release)
              HEAD_BRANCH="$PRERELEASE_BRANCH"
              TITLE="Start pre-release v${{ env.NEW_VERSION }}"
              BODY="Pre-release v${{ env.NEW_VERSION }} from \`$PRERELEASE_BRANCH\`"
              ;;
            promote)
              HEAD_BRANCH="$PRERELEASE_BRANCH"
              TITLE="Start release v${{ env.NEW_VERSION }}"
              BODY="Promote pre-release to stable v${{ env.NEW_VERSION }}"
              ;;
            *)
              HEAD_BRANCH="develop"
              TITLE="Start release v${{ env.NEW_VERSION }}"
              BODY="Merge develop into main for release v${{ env.NEW_VERSION }}"
              ;;
          esac

          gh pr create \
            --base main \
            --head "$HEAD_BRANCH" \
            --title "$TITLE" \
            --body "$BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
