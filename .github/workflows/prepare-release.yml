name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Create a pre-release?'
        required: false
        type: boolean
        default: false
      prerelease_tag:
        description: 'Pre-release tag (only used when prerelease is true)'
        required: false
        type: choice
        default: 'beta'
        options:
          - beta
          - alpha
          - rc
          - next

jobs:
  create-release-pr:
    if: github.repository == 'adyen/adyen-platform-experience-web'
    name: Create release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout develop branch (full history)
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Run the preliminary setup steps
        uses: ./.github/actions/setup-env
        with:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Enter pre-release mode
        if: inputs.prerelease
        env:
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "Pre-release mode already active, skipping enter."
          else
            pnpm changeset pre enter "$TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .changeset/pre.json
            git commit -m "chore(release): enter pre-release mode ($TAG)"
            git push origin develop
          fi

      - name: Validate changesets exist
        run: |
          pnpm changeset status || {
            echo "::error::No changesets found. Cannot proceed with release."
            exit 1
          }

      - name: Determine new version
        run: |
          pnpm changeset status --output=release.json
          NEW_VERSION=$(jq -r '.releases[0].newVersion' release.json)
          rm release.json
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Create Pull Request
        run: |
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            TITLE="Start pre-release v${{ env.NEW_VERSION }}"
            BODY="Merge develop into main for pre-release v${{ env.NEW_VERSION }}"
          else
            TITLE="Start release v${{ env.NEW_VERSION }}"
            BODY="Merge develop into main for release v${{ env.NEW_VERSION }}"
          fi

          gh pr create \
            --base main \
            --head develop \
            --title "$TITLE" \
            --body "$BODY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
