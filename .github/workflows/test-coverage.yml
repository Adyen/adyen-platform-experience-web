name: Unit Test Coverage

on:
    pull_request:
        branches:
            - main
            - develop
            - version/v1.x
            - group/*
            - bot/translations
        types: [opened, synchronize, reopened]
        paths-ignore:
            - README.md
            - LICENSE
            - .gitignore
    pull_request_review:
        types: [submitted]

concurrency:
    group: changed-typescript-coverage-${{ github.event.pull_request.number }}-${{ github.event_name }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    unit-tests:
        name: Unit tests
        if: |
            github.event_name == 'pull_request' ||
            (github.event_name == 'pull_request_review' &&
             github.event.review.state == 'approved' &&
             (github.event.pull_request.base.ref == 'main' ||
              github.event.pull_request.base.ref == 'develop' ||
              github.event.pull_request.base.ref == 'version/v1.x' ||
              startsWith(github.event.pull_request.base.ref, 'group/')))
        runs-on: ubuntu-latest
        timeout-minutes: 15
        outputs:
            coverage_artifact: ${{ steps.unit-coverage-artifact.outcome == 'success' }}
        env:
            COVERAGE_ENABLED: >-
                ${{ github.event_name == 'pull_request' &&
                    github.event.pull_request.head.repo.full_name == github.repository &&
                    (github.event.pull_request.base.ref == 'develop' ||
                     startsWith(github.event.pull_request.base.ref, 'group/')) }}
        steps:
            - name: Check if automated sync PR
              id: skip-check
              if: >-
                  github.event.pull_request.user.login == 'github-actions[bot]'
                  && startsWith(github.event.pull_request.head.ref, 'chore/sync-main-into-develop')
                  && startsWith(github.event.pull_request.title, 'chore(release): sync main into develop')
              run: echo "Skipping unit tests (automated sync PR)"

            - name: Checkout PR head
              if: steps.skip-check.outcome != 'success'
              uses: actions/checkout@v4.2.2
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Run the preliminary setup steps
              if: steps.skip-check.outcome != 'success'
              uses: ./.github/actions/setup-env
              with:
                  NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

            - name: Run unit tests
              if: steps.skip-check.outcome != 'success' && env.COVERAGE_ENABLED != 'true'
              run: pnpm run test -- --run

            - name: Run unit tests with coverage
              if: steps.skip-check.outcome != 'success' && env.COVERAGE_ENABLED == 'true'
              env:
                  TEST_ENV: 1
              run: pnpm run test:coverage:unit

            - name: Verify unit coverage report
              if: steps.skip-check.outcome != 'success' && env.COVERAGE_ENABLED == 'true'
              run: test -s coverage-unit/lcov.info

            - name: Upload unit coverage
              id: unit-coverage-artifact
              if: steps.skip-check.outcome != 'success' && env.COVERAGE_ENABLED == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: unit-coverage-${{ github.event.pull_request.head.sha }}
                  path: coverage-unit/lcov.info
                  if-no-files-found: error
                  retention-days: 1

    changed-typescript-coverage:
        name: Unit-test coverage for changed code (pilot)
        needs: unit-tests
        if: >-
            always() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            (github.event.pull_request.base.ref == 'develop' ||
             startsWith(github.event.pull_request.base.ref, 'group/')) &&
            needs.unit-tests.outputs.coverage_artifact == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout PR head
              uses: actions/checkout@v4.2.2
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@v4.4.0
              with:
                  node-version: 24.18.0

            - name: Download unit coverage
              uses: actions/download-artifact@v4
              with:
                  name: unit-coverage-${{ github.event.pull_request.head.sha }}
                  path: coverage-unit

            - name: Test changed coverage checker
              run: node --test scripts/check-changed-coverage/check.test.mjs

            - name: Verify unit coverage report
              run: test -s coverage-unit/lcov.info

            # Only the changed-lines result is non-blocking during the pilot.
            - name: Report unit-test coverage of changed code
              continue-on-error: true
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: node scripts/check-changed-coverage/check.mjs "$BASE_SHA" "$HEAD_SHA"

            - name: Upload PR coverage comment
              uses: actions/upload-artifact@v4
              with:
                  name: changed-typescript-coverage-comment
                  path: coverage-unit/pr-comment.md
                  if-no-files-found: error
                  retention-days: 1

    coverage-comment:
        name: Post unit-test coverage for changed code
        needs: changed-typescript-coverage
        if: needs.changed-typescript-coverage.result == 'success'
        runs-on: ubuntu-latest
        permissions:
            actions: read
            pull-requests: write
        steps:
            - name: Download PR coverage comment
              uses: actions/download-artifact@v4
              with:
                  name: changed-typescript-coverage-comment

            - name: Replace PR coverage comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const body = require('node:fs').readFileSync('pr-comment.md', 'utf8');
                      const marker = '<!-- changed-typescript-coverage-pilot -->';
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
                      const previous = comments.filter(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));

                      for (const comment of previous) {
                          await github.rest.issues.deleteComment({ owner, repo, comment_id: comment.id });
                      }
                      await github.rest.issues.createComment({ owner, repo, issue_number, body });

    sonar-analysis:
        name: Analyze
        needs: unit-tests
        if: >-
            always() &&
            github.event_name == 'pull_request' &&
            github.event.pull_request.base.ref == 'develop' &&
            github.actor != 'dependabot[bot]' &&
            github.event.pull_request.head.repo.full_name == github.repository &&
            needs.unit-tests.outputs.coverage_artifact == 'true'
        permissions:
            contents: read
            actions: read
        uses: ./.github/workflows/sonarcloud.yml
        secrets: inherit
