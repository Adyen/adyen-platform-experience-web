# Do a git tag and create a release when a release branch is merged (or on demand)
name: Create a tag and GitHub release

on:
  workflow_dispatch:

  pull_request:
    types: [closed]
    branches: ['main', 'version/v1.x']

jobs:
  release-v1:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'version/v1.x' &&
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'chore/v1-release-') &&
      startsWith(github.event.pull_request.title, 'chore(release): prepare v1.')
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: read
    uses: ./.github/workflows/release-v1.yml
    secrets: inherit

  create-github-release:
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.determine_version.outputs.version }}
      npm_tag: ${{ steps.determine_version.outputs.npm_tag }}
      is_prerelease: ${{ steps.determine_version.outputs.is_prerelease }}
      release_line: ${{ steps.determine_version.outputs.release_line }}
      source_sha: ${{ steps.determine_version.outputs.source_sha }}
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'main'
      && (startsWith(github.head_ref, 'bump/') || startsWith(github.head_ref, 'changeset-release/')))
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Determine and validate mainline release
        id: determine_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "NEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_line=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *"-"* ]]; then
            PRE_TAG=$(echo "$VERSION" | sed 's/.*-\([a-zA-Z]*\).*/\1/')
            NPM_TAG=$PRE_TAG
            IS_PRERELEASE=true
          else
            NPM_TAG=latest
            IS_PRERELEASE=false
          fi

          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"

          node scripts/npm-publish/determine-release.mjs determine \
            --package-json package.json \
            --release-version "$VERSION" \
            --npm-tag "$NPM_TAG" \
            --release-line mainline \
            --runner-temp "$RUNNER_TEMP"

          PACKAGE_MAJOR=${VERSION%%.*}
          if [[ "$IS_PRERELEASE" == "false" && "$PACKAGE_MAJOR" == "2" ]]; then
            V1_LATEST_VERSION=$(npm view @adyen/adyen-platform-experience-web@v1-latest version)
            node scripts/npm-publish/determine-release.mjs validate-stable-v1 \
              --version "$V1_LATEST_VERSION"
          fi

      - name: Run the preliminary setup steps
        uses: ./.github/actions/setup-env
        with:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

      - name: Create a build and export an artifact
        run: |
          pnpm run build:publish

      - name: Upload build as artifact for other jobs
        uses: actions/upload-artifact@v4.6.2
        with:
          name: adyen-adyen-platform-experience-web-${{ env.NEW_VERSION }}
          path: ./adyen-adyen-platform-experience-web-${{ env.NEW_VERSION }}.tgz
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
          overwrite: true

      - name: Push tags and create a release
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpx @changesets/cli@2.29.8 tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename scoped tag to semver tag
        # changeset tag creates scoped tags (e.g. @adyen/adyen-platform-experience-web@1.0.0)
        # but the rest of this workflow and external tooling expect v-prefixed semver tags (e.g. v1.0.0).
        # This step renames the tag and updates the GitHub release to match.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derives the scoped tag from the published packages output, e.g. @adyen/adyen-platform-experience-web@1.0.0
          SCOPED_TAG=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[] | select(.name == "@adyen/adyen-platform-experience-web") | "\(.name)@\(.version)"')

          # Strips everything up to and including the last @ (the package name), then prepends v, e.g. v1.0.0
          SEMVER_TAG="v${SCOPED_TAG##*@}"

          # Create the semver tag pointing at the same commit as the scoped one
          git tag "$SEMVER_TAG" "$SCOPED_TAG"
          git push origin "$SEMVER_TAG"

          # Update the GitHub release to point to the new tag and publish it.
          # This must run before deleting the scoped tag so the release is still
          # findable by its tag_name via the GitHub API.
          PRERELEASE_FLAG=""
          if [[ "${{ env.IS_PRERELEASE }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release edit "$SCOPED_TAG" --tag "$SEMVER_TAG" --title "$SEMVER_TAG" --draft=false $PRERELEASE_FLAG

          # Remove the scoped tag now that the release points to the semver tag
          git tag -d "$SCOPED_TAG"
          git push origin --delete "$SCOPED_TAG"

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ env.NEW_VERSION }}" \
            ./adyen-adyen-platform-experience-web-${{ env.NEW_VERSION }}.tgz \
            --repo "${{ github.repository }}"

      - name: Build umd file
        env:
          VERSION: ${{ env.NEW_VERSION }}
        run: |
          ./scripts/upload-assets/generate-umd-file.sh

      - name: Upload UMD file in new tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
          ASSET_PATH: './platform-components_cdn_${{ env.NEW_VERSION }}.tar.gz'
        run: |
          echo "Targeting repository: $TARGET_REPO"
          echo "Using tag: ${{ env.NEW_VERSION }}"

          # Upload the new asset to the target repo using the new tag
          gh release upload "v${{ env.NEW_VERSION }}" "$ASSET_PATH" \
            --repo "$TARGET_REPO"

  trigger-npm-publish:
    permissions:
      contents: write
      actions: write
      id-token: write
    needs: create-github-release
    uses: ./.github/workflows/npm-publish.yml
    secrets: inherit
    with:
      source_run_id: ${{ github.run_id }}
      npm_tag: ${{ needs.create-github-release.outputs.npm_tag }}
      release_version: ${{ needs.create-github-release.outputs.release_version }}
      source_sha: ${{ needs.create-github-release.outputs.source_sha }}
      release_line: mainline

  sync-develop:
    needs: [create-github-release, trigger-npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Create PR to sync main into develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-github-release.outputs.release_version }}
        run: |
          SYNC_BRANCH="chore/sync-main-into-develop-v$VERSION"

          # Check if a sync PR already exists
          EXISTING=$(gh pr list --base develop --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Sync PR #$EXISTING already exists, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$SYNC_BRANCH" origin/main
          git push origin "$SYNC_BRANCH"

          gh pr create \
            --base develop \
            --head "$SYNC_BRANCH" \
            --title "chore(release): sync main into develop after v$VERSION" \
            --body "Syncs version bump and consumed changesets from v$VERSION into develop."

  upload-assets:
    if: needs.create-github-release.outputs.is_prerelease != 'true'
    permissions:
      contents: write
      actions: write
    needs: create-github-release
    uses: ./.github/workflows/upload-assets-to-release-tag.yml
    secrets: inherit
    with:
      environment_choice: 'live'
      release_line: ${{ needs.create-github-release.outputs.release_line }}
      source_ref: ${{ needs.create-github-release.outputs.source_sha }}
