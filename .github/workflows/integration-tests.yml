name: Integration Tests

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
    branches:
      - main
      - develop
      - group/*
      - pre-release/*

env:
  CI: true
  PLAYGROUND_HOST: localhost
  PLAYGROUND_PORT: 4173
  PLAYGROUND_URL: http://localhost:4173

jobs:
  is-pr-approved:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - id: approval-status
        run: |
          REVIEWS=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --paginate)
          APPROVALS_FOR_HEAD=$(echo "$REVIEWS" | jq --arg head_sha "$HEAD_SHA" '[.[] | select(.state == "APPROVED" and .commit_id == $head_sha)] | length')
          PRIOR_APPROVALS_FOR_HEAD=$(echo "$REVIEWS" | jq --arg head_sha "$HEAD_SHA" --arg review_id "$REVIEW_ID" '[.[] | select(.state == "APPROVED" and .commit_id == $head_sha and (.id | tostring) != $review_id)] | length')

          if [[ "$PR_AUTHOR" == "github-actions[bot]" && "$HEAD_REF" == chore/sync-main-into-develop* && "$PR_TITLE" == "chore(release): sync main into develop"* ]]; then
            echo "Skipping integration tests (automated sync PR)"
            echo "should_run_jobs=true" >> "$GITHUB_OUTPUT"
            echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request_review" && "$REVIEW_STATE" == "approved" && "$PRIOR_APPROVALS_FOR_HEAD" -gt 0 ]]; then
            echo "Skipping integration tests (additional approval without code changes)"
            echo "should_run_jobs=true" >> "$GITHUB_OUTPUT"
            echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$APPROVALS_FOR_HEAD" -gt 0 ]; then
            echo "should_run_jobs=true" >> "$GITHUB_OUTPUT"
            echo "should_run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run_jobs=false" >> "$GITHUB_OUTPUT"
            echo "should_run_tests=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_ID: ${{ github.event.review.id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_TITLE: ${{ github.event.pull_request.title }}
    outputs:
      should_run_jobs: ${{ steps.approval-status.outputs.should_run_jobs }}
      should_run_tests: ${{ steps.approval-status.outputs.should_run_tests }}

  build-storybook-static:
    needs: is-pr-approved
    if: needs.is-pr-approved.outputs.should_run_jobs == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        framework: [preact, vue]
    env:
      TEST_ENV: 1
      USE_CDN: false
      SHOULD_RUN_TESTS: ${{ needs.is-pr-approved.outputs.should_run_tests }}
    steps:
      - if: env.SHOULD_RUN_TESTS != 'true'
        id: skip
        run: echo "Skipping build (integration tests not required)"

      - name: Checkout the repo
        if: env.SHOULD_RUN_TESTS == 'true'
        uses: actions/checkout@v3

      - name: Run the preliminary setup steps
        if: env.SHOULD_RUN_TESTS == 'true'
        uses: ./.github/actions/setup-env
        with:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

      - name: Build Storybook static files
        if: env.SHOULD_RUN_TESTS == 'true'
        run: pnpm run storybook:build:${{ matrix.framework }}

      - name: Upload Storybook static artifact
        if: env.SHOULD_RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ matrix.framework }}-${{ github.sha }}
          path: packages/tools/storybook/storybook-static/
          retention-days: 1

  e2e-local-mocked-api:
    needs:
      - is-pr-approved
      - build-storybook-static
    if: needs.is-pr-approved.outputs.should_run_jobs == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        framework: [preact, vue]
        shard:
          - index: 1
            total: 2
          - index: 2
            total: 2
    env:
      PLAYWRIGHT_WORKERS: 1
      PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm exec vite preview --outDir storybook-static --config packages/tools/storybook/vite.config.ts
      SHOULD_RUN_TESTS: ${{ needs.is-pr-approved.outputs.should_run_tests }}
    steps:
      - if: env.SHOULD_RUN_TESTS != 'true'
        id: skip
        run: echo "Skipping tests (integration tests not required)"

      - name: Checkout the repo
        if: env.SHOULD_RUN_TESTS == 'true'
        uses: actions/checkout@v3

      - name: Run the preliminary setup steps
        if: env.SHOULD_RUN_TESTS == 'true'
        uses: ./.github/actions/setup-env
        with:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

      - name: Download Storybook static artifact
        if: env.SHOULD_RUN_TESTS == 'true'
        uses: actions/download-artifact@v4
        with:
          name: storybook-static-${{ matrix.framework }}-${{ github.sha }}
          path: storybook-static

      - name: Run tests (shard ${{ matrix.shard.index }}/${{ matrix.shard.total }})
        if: env.SHOULD_RUN_TESTS == 'true'
        run: pnpm run test:integration:${{ matrix.framework }} --shard=${{ matrix.shard.index }}/${{ matrix.shard.total }}

      - name: Upload Playwright report (on failure)
        if: failure() && env.SHOULD_RUN_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.framework }}-${{ github.sha }}-shard-${{ matrix.shard.index }}
          path: playwright-report/
          retention-days: 3