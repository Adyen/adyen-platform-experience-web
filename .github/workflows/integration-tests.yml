name: Integration Tests

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]
    branches:
      - main
      - develop
      - group/*
      - pre-release/*

env:
  CI: true
  PLAYGROUND_HOST: localhost
  PLAYGROUND_PORT: 4173
  PLAYGROUND_URL: http://localhost:4173

jobs:
  is-pr-approved:
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - if: >-
          github.event.pull_request.user.login == 'github-actions[bot]'
          && github.event.pull_request.head.ref == 'main'
          && startsWith(github.event.pull_request.title, 'chore(release): sync main into develop')
        id: skip
        run: echo "Skipping integration tests (automated sync PR)"

      - if: ${{ steps.skip.outcome != 'success' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - if: ${{ steps.skip.outcome != 'success' }}
        id: check-approval
        run: gh pr status --json reviews -q '.currentBranch.reviews' | jq '.[]' | jq '.state' | grep APPROVED
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true

      - if: ${{ steps.skip.outcome != 'success' }}
        run: echo ${{ steps.check-approval.outcome == 'success' }}
    outputs:
      approved: ${{ steps.check-approval.outcome == 'success' }}
      skipped: ${{ steps.skip.outcome == 'success' }}

  build-storybook-static:
    needs: is-pr-approved
    if: needs.is-pr-approved.outputs.skipped == 'true' || needs.is-pr-approved.outputs.approved == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        framework: [preact, vue]
    env:
      TEST_ENV: 1
      USE_CDN: false
    steps:
      - if: needs.is-pr-approved.outputs.skipped == 'true'
        id: skip
        run: echo "Skipping build (automated sync PR)"

      - name: Checkout the repo
        if: steps.skip.outcome != 'success'
        uses: actions/checkout@v3

      - name: Run the preliminary setup steps
        if: steps.skip.outcome != 'success'
        uses: ./.github/actions/setup-env
        with:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

      - name: Build Storybook static files
        if: steps.skip.outcome != 'success'
        run: pnpm run storybook:build:${{ matrix.framework }}

      - name: Upload Storybook static artifact
        if: steps.skip.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static-${{ matrix.framework }}-${{ github.sha }}
          path: packages/tools/storybook/storybook-static/
          retention-days: 1

  e2e-local-mocked-api:
    needs:
      - is-pr-approved
      - build-storybook-static
    if: needs.is-pr-approved.outputs.skipped == 'true' || needs.is-pr-approved.outputs.approved == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        framework: [preact, vue]
        shard:
          - index: 1
            total: 2
          - index: 2
            total: 2
    env:
      PLAYWRIGHT_WORKERS: 1
      PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm exec vite preview --outDir storybook-static --config packages/tools/storybook/vite.config.ts
    steps:
      - if: needs.is-pr-approved.outputs.skipped == 'true'
        id: skip
        run: echo "Skipping tests (automated sync PR)"

      - name: Checkout the repo
        if: steps.skip.outcome != 'success'
        uses: actions/checkout@v3

      - name: Run the preliminary setup steps
        if: steps.skip.outcome != 'success'
        uses: ./.github/actions/setup-env
        with:
          NPM_READ_ONLY_TOKEN: ${{ secrets.NPM_READ_ONLY_TOKEN }}

      - name: Download Storybook static artifact
        if: steps.skip.outcome != 'success'
        uses: actions/download-artifact@v4
        with:
          name: storybook-static-${{ matrix.framework }}-${{ github.sha }}
          path: storybook-static

      - name: Run tests (shard ${{ matrix.shard.index }}/${{ matrix.shard.total }})
        if: steps.skip.outcome != 'success'
        run: pnpm run test:integration:${{ matrix.framework }} --shard=${{ matrix.shard.index }}/${{ matrix.shard.total }}

      - name: Upload Playwright report (on failure)
        if: failure() && steps.skip.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.framework }}-${{ github.sha }}-shard-${{ matrix.shard.index }}
          path: playwright-report/
          retention-days: 3