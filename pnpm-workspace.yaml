packages:
  - "."
  - "packages/**"

# Single source of truth for shared dependency versions across the workspace.
# The root `pnpm.overrides.preact` references `catalog:` so bumping preact here
# forces every resolution in the tree (including transitive deps like
# @adyen/kyc-components that declare a different exact version) to converge.
catalog:
  '@adyen/bento-vue3': 1.107.0
  '@adyen/ui-assets-icons-16': 7.9.7
  '@adyen/ui-assets-icons-40': 4.9.2
  "@playwright/test": ^1.61.0
  "@storybook/preact": 10.2.12
  "@storybook/vue3": 10.2.12
  "@testing-library/preact": ^3.2.3
  "@vitest/coverage-v8": 4.0.10
  classnames: ^2.5.1
  dotenv: ^17.2.3
  msw: ^2.7.3
  preact: ^10.29.1
  storybook: 10.2.12
  typescript: 5.8.3
  vite: ^7.3.5
  vitest: 4.1.0
  vue: ^3.5.13
  webpack: ^5.106.2

overrides:
  "@babel/core": "7.29.6"
  "@babel/plugin-transform-modules-systemjs": "7.29.4"
  "@types/node": "24.10.13"
  "axios": "1.18.0"
  "brace-expansion": "5.0.7"
  "esbuild": "0.28.1"
  "fast-uri": "4.1.2"
  "follow-redirects": "1.16.0"
  "form-data": "4.0.6"
  "immutable": "4.3.9"
  "js-yaml": "4.3.1"
  "lodash": "4.18.1"
  "minimatch@<9.0.7": "10.2.4"
  "picomatch": "4.0.4"
  "postcss": "8.5.25"
  "preact": "catalog:"
  "rollup@4.53.3": "4.59.0"
  "semver@6.3.x": "6.3.0"
  "serialize-javascript@6.0.2": "7.0.3"
  "shell-quote": "1.9.0"
  "tmp": "0.2.7"
  "typescript": "catalog:"
  "uuid": "11.1.1"
  "webpack": "catalog:"
  "ws": "8.21.0"

trustPolicyExclude:
  - "@redocly/openapi-core@1.34.6"
  - "chokidar@4.0.3"
  - "detect-port@1.6.1"
  - "eslint-import-resolver-typescript@3.10.1"
  - "ts-api-utils@2.3.0"

allowBuilds:
  "@parcel/watcher": false
  core-js: false
  esbuild: false
  msw: false
  nx: false
  unrs-resolver: false
  vue-demi: false
