  "fast-uri": "4.1.5"
  "follow-redirects": "1.16.0"
  "form-data": "4.0.6"
  "immutable": "4.3.9"
  "js-yaml": "4.3.2"
  "lodash": "4.18.1"
  "minimatch@<9.0.7": "10.2.4"
  "picomatch": "4.0.4"
  "postcss": "8.5.25"
